[project]
name = "zhibiao"
version = "2.0.0"
description = "智标 - 全流程智能招投标平台"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-only" }
authors = [{ name = "Foulereee", email = "1817558146@qq.com" }]
maintainers = [{ name = "Foulereee", email = "1817558146@qq.com" }]

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "aiomysql>=0.2",
    "aiosqlite>=0.20",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "openai>=1.0",
    "bcrypt>=4.0",
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
    "reportlab>=4.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["zhibiao*"]
exclude = ["tests*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
